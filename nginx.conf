events {
    worker_connections 1024;
}

http {
    server {
        # Render provides the PORT environment variable
        # We will use an entrypoint script to inject the correct port into this file
        listen ${PORT};

        # Handle Render health check HEAD requests (reply 200 without forwarding to backend)
        location = / {
            if ($request_method = HEAD) {
                return 200;
            }
            proxy_pass http://127.0.0.1:8080;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_connect_timeout 120s;
            proxy_read_timeout 120s;
            proxy_send_timeout 120s;
        }

        # Route WebSocket traffic
        location /ws {
            if ($request_method = HEAD) {
                return 200;
            }
            proxy_pass http://127.0.0.1:8765;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "Upgrade";
            proxy_set_header Host $host;
            proxy_read_timeout 86400;
        }

        # Route Main Web UI (all other paths)
        location / {
            proxy_pass http://127.0.0.1:8080;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_connect_timeout 120s;
            proxy_read_timeout 120s;
            proxy_send_timeout 120s;
        }
    }
}
